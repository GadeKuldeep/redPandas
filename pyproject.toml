[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redpandas-prep"
version = "0.2.0"
description = "Enterprise-grade ML data-preparation pipeline with integrated visual health reporting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Author", email = "author@example.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["pandas>=1.5", "numpy>=1.23"]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "seaborn>=0.12"]
all = ["matplotlib>=3.6", "seaborn>=0.12", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/author/redpandas"
Repository = "https://github.com/author/redpandas.git"
Issues = "https://github.com/author/redpandas/issues"

[tool.setuptools.packages.find]
where = ["src"]
